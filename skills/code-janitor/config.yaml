# Code Janitor Skill Configuration
# Defines default operational parameters for code smell detection and cleanup.

code_janitor:
  thresholds:
    max_function_lines: 30
    max_parameters: 5
    max_nesting_depth: 4
    max_cyclomatic_complexity: 10

  detection:
    unused_imports: true
    dead_code: true
    oversized_functions: true
    deep_nesting: true
    missing_docstrings: true
    missing_type_annotations: true
    stale_todos: true
    too_many_parameters: true

  safety:
    run_tests_before_fix: true
    run_tests_after_fix: true
    rollback_on_failure: true

  reporting:
    verbose: true
    generate_summary_report: true

  modernization:
    enabled: true
    language_extensions:
      javascript_typescript: ["js", "jsx", "ts", "tsx", "mjs", "cjs"]
      python: ["py", "pyi"]
      rust: ["rs"]
      go: ["go"]
    rules:
      verbose_guard_checks:
        extensions: ["js", "jsx", "ts", "tsx", "mjs", "cjs"]
      redundant_ternary:
        extensions: ["js", "jsx", "ts", "tsx", "mjs", "cjs", "py"]
      nullish_coalescing:
        extensions: ["js", "jsx", "ts", "tsx", "mjs", "cjs"]
      logical_assignment:
        extensions: ["js", "jsx", "ts", "tsx", "mjs", "cjs"]

