[package]
name = "agent-skills-cli"
version = "0.1.0"
edition = "2021"
description = "Unified CLI for Agent Skills automation"

[[bin]]
name = "agent-skills"
path = "src/main.rs"

[dependencies]
agent_skills_core = { path = "../core" }
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
shlex = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.8"
