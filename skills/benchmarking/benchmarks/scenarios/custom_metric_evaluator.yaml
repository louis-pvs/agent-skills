version: "1.0.0"
skill: "benchmarking"
scenario_id: "custom_metric_evaluator"
description: "Evaluate expandable metric evaluators and feed structured JSON output to continuous loops"
complexity: "medium"
max_turns: 8
timeout_seconds: 60
prompt: |
  Run benchmark evaluation with expandable metric evaluators `timing,pass_ratio` and format summary for self-annealer integration.
eval_criteria:
  assertions:
    - type: "regex_match"
      pattern: "summary"
    - type: "max_tool_calls"
      threshold: 4.0
