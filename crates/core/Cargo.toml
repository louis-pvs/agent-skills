[package]
name = "agent_skills_core"
version = "0.1.0"
edition = "2021"
description = "Core library providing path safety, 4-tier configuration, and depgraph management for agent-skills"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.8"
