# Agent Council Configuration
# Add or remove council members as needed.
# Missing CLIs are automatically detected and reported as missing_cli at runtime.

council:
  # Council members configuration
  # Each member needs:
  #   - name: identifier for the agent
  #   - command: CLI command to execute (prompt will be appended)
  #   - emoji: display emoji (optional)
  #   - color: ANSI color (RED, GREEN, BLUE, YELLOW, CYAN)

  members:
    - name: antigravity
      command: "agy -p"
      emoji: "💎"
      color: "GREEN"

    - name: copilot
      command: "copilot -p"
      emoji: "✈️"
      color: "BLUE"

    - name: claude
      command: "claude -p"
      emoji: "🧠"
      color: "CYAN"

  # Chairman configuration (Antigravity will act as chairman)
  chairman:
    # role: auto|claude|codex|antigravity|...
    # - auto: infer from host tool (Antigravity => antigravity, Claude Code => claude, Codex CLI => codex)
    role: "antigravity"
    description: "Synthesizes all opinions and provides final recommendation"

  # Execution settings
  settings:
    timeout: 120 # Timeout seconds per agent (0 to disable)
    exclude_chairman_from_members: true # Avoid calling the chairman as a member by default
