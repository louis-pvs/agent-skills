# Agent Council Configuration
# Add or remove council members as needed.
# Missing CLIs are automatically detected and reported as missing_cli at runtime.

council:
  # Chairman configuration (Antigravity acts as chairman)
  chairman:
    role: "antigravity"
    description: "Synthesizes all opinions and provides final recommendation"

  # Council members configuration
  # Each member needs:
  #   - name: identifier for the agent
  #   - command: CLI command to execute (prompt will be appended)
  #   - emoji: display emoji (optional)
  #   - color: ANSI color (RED, GREEN, BLUE, YELLOW, CYAN)
  members:
    - name: antigravity
      command: "agy --dangerously-skip-permissions -p"
      emoji: "💎"
      color: "GREEN"

    - name: copilot
      command: "copilot -p"
      emoji: "✈️"
      color: "BLUE"

    - name: claude
      command: "claude --dangerously-skip-permissions -p"
      emoji: "🧠"
      color: "CYAN"

  # Execution settings
  settings:
    timeout: 120 # Timeout seconds per agent (0 to disable)
    exclude_chairman_from_members: false # Include chairman CLI as an active voting member


