[package]
name = "agent-skills"
version = "0.1.0"
edition = "2021"
description = "Unified CLI for Agent Skills automation"

[dependencies]
agent_skills_core = { path = "../core" }
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.8"
