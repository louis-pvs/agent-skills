version: "1.0.0"
skill: "benchmarking"
scenario_id: "performance_regression_check"
description: "Verify command execution speed, duration threshold, and pass ratio assertions"
complexity: "medium"
max_turns: 8
timeout_seconds: 60
prompt: |
  Benchmark the command `cargo test` with 5 statistical iterations, asserting max duration under 500ms and minimum 1.0 pass ratio.
eval_criteria:
  assertions:
    - type: "regex_match"
      pattern: "pass_ratio"
    - type: "max_tool_calls"
      threshold: 5.0
